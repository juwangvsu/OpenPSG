[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psgtr-hf"
version = "0.5.2"
description = "Panoptic Scene Graph Transformer implemented with Hugging Face Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "OpenAI"}]
dependencies = [
  "torch>=2.4",
  "transformers==5.14.1",
  "scipy>=1.10",
  "pillow>=9.0",
  "numpy>=1.24",
]

[project.scripts]
psgtr-train = "psgtr_hf.training:main"
psgtr-infer = "psgtr_hf.inference:main"
psgtr-evaluate = "psgtr_hf.evaluating:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["psgtr_hf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
